name: ci

# Manual only for now.
#
# This workflow is correct (it runs `npm run check` and `npm test` on Node 22
# and 24), but GitHub refuses to start the jobs on this account and reports
# "The job was not started because your account is locked due to a billing
# issue." Every push therefore showed a red cross that had nothing to do with
# the code.
#
# Once billing is sorted out, restore the automatic triggers:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#
# Until then, run it by hand from the Actions tab (or just run `npm test`
# locally, which is what it does).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
